name: Joint-helper conditional construction
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/frontier4470.yml'
      - 'LICENSE'
      - 'certificates/checkpoints/frontier4359.json'
      - 'certificates/frontier4359-source.json'
      - 'certificates/frontier4470-source.json'
      - 'certificates/frontier4470/**'
      - 'certificates/frontier4470/CLAIM.json'
      - 'certificates/frontier4470/prior-task-catalog.json'
      - 'certificates/selected-result.json'
      - 'docs/research/pr-intake-evidence/pr4359/**'
      - 'docs/research/pr-intake-evidence/pr4416/**'
      - 'docs/research/pr-intake-evidence/pr4470/**'
      - 'notes/batched-bit-rows.tex'
      - 'notes/batched-complex-rows.tex'
      - 'notes/compact-control-movement.tex'
      - 'notes/general-clifford-frames.tex'
      - 'notes/stopped-product-complex.tex'
      - 'notes/three-stage-cover-bit.tex'
      - 'notes/three-stage-cover-rows.tex'
      - 'references/semantic-bulk/pr23/semantic-bulk-17-note.tex'
      - 'research/e8-bit-carrier-skeleton/**'
      - 'research/e8-bit-p111-tuned/**'
      - 'research/fresh-helper-boundary/**'
      - 'research/fresh-helper-thinned/**'
      - 'research/higher-moment-strictification/**'
      - 'research/joint-helper-lattice/**'
      - 'research/kappa-0023-productive-jobs/**'
      - 'research/kappa-accounted-composition/**'
      - 'research/kappa-causal-continuation/**'
      - 'research/kappa-function-composition/**'
      - 'research/kappa-global-routing/**'
      - 'research/kappa-native-resume/**'
      - 'research/kappa-observation-integration/**'
      - 'research/kappa-rebuild/**'
      - 'research/missing-join-frame/**'
      - 'research/pr4359-p7-padding/**'
      - 'research/pr4470-arithmetic-check/**'
      - 'research/pr4470-frame-audit/**'
      - 'research/query-thinned-controllers/**'
      - 'research/stage-zero-commutation-audit/**'
      - 'research/stage-zero-forced-translation/**'
      - 'research/t74-native-fast/**'
      - 'scripts/verify_frontier4470.py'
      - 'scripts/verify_selected_result.py'
permissions:
  contents: read
concurrency:
  group: selected-frontier4470-${{ github.ref }}
  cancel-in-progress: true
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -B scripts/verify_frontier4470.py --work "$RUNNER_TEMP/frontier4470"
      - run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontier4470-replay
          path: |
            ${{ runner.temp }}/frontier4470/VALIDATION.json
            ${{ runner.temp }}/frontier4470/source/review-evidence/*.log
            ${{ runner.temp }}/frontier4470/source/review-evidence/*.json
